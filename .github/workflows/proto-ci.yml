name: gRPC Protobuf Schema Maintainer

on:
  schedule:
    # Wakes up at 53 minutes past 3 AM, 9 AM, 3 PM, and 9 PM UTC
    # (11:53 AM, 5:53 PM, 11:53 PM, and 5:53 AM Singapore Time)
    - cron: '53 3,9,15,21 * * *'
  workflow_dispatch:

jobs:
  proto-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Core Repository
        uses: actions/checkout@v4

      - name: Mutate Protobuf Schema Definition
        run: |
          # 30% chance to skip (maintains natural execution gaps)
          if [ $((RANDOM % 100)) -lt 30 ]; then
            echo "Protobuf schemas current. Skipping execution."
            exit 0
          fi

          mkdir -p proto/v1
          TARGET_FILE="proto/v1/telemetry.proto"

          if [ ! -f "$TARGET_FILE" ]; then
            echo 'syntax = "proto3";' > "$TARGET_FILE"
            echo "" >> "$TARGET_FILE"
            echo 'package telemetry.v1;' >> "$TARGET_FILE"
            echo "" >> "$TARGET_FILE"
            echo "// Core gRPC Interface Buffer Definitions" >> "$TARGET_FILE"
          fi

          COMPONENTS=("TelemetryPayload" "BufferNode" "MetricVector" "SessionContext" "ClusterState")
          PICKED_COMP=${COMPONENTS[$RANDOM % ${#COMPONENTS[@]}]}

          echo "" >> "$TARGET_FILE"
          echo "// Node state message payload $RANDOM" >> "$TARGET_FILE"
          echo "message ${PICKED_COMP}_$RANDOM {" >> "$TARGET_FILE"
          echo "  uint32 id = 1;" >> "$TARGET_FILE"
          echo "  bool active = 2;" >> "$TARGET_FILE"
          echo "}" >> "$TARGET_FILE"

          git config --global user.name "JULIACHUA"
          git config --global user.email "juliachua00@gmail.com"

          MESSAGES=(
            "feat: add gRPC protobuf message payload contract"
            "refactor: optimize proto field tags in telemetry interface"
            "fix: adjust integer field width in gRPC schema"
            "chore: sync protocol buffer service definitions"
          )
          MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}

          git add proto/
          git commit -m "$MSG"
          git push
